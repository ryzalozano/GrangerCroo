<section class="book-details">

  <div class="book-image">
    <img [src]="book.image" [alt]="book.title">
  </div>

  <div class="book-info">

    <h1>{{ book.title }}</h1>

    <p class="author">{{ book.author }}</p>

    <p class="price">₱{{ book.price }}</p>

    <div class="book-actions">

      <button type="button" class="wishlist-btn" aria-label="Add to wishlist">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 20s-7-4.4-7-10.1C5 6.9 6.7 5 9.1 5c1.4 0 2.4.7 2.9 1.7C12.5 5.7 13.5 5 14.9 5 17.3 5 19 6.9 19 9.9 19 15.6 12 20 12 20z"></path>
        </svg>
      </button>

      <div class="quantity">

        <button type="button" (click)="decreaseQuantity()">−</button>

        <span>{{ quantity }}</span>

        <button type="button" (click)="increaseQuantity()">+</button>

      </div>

      <button type="button" class="add-cart">
        ADD TO CART
      </button>

    </div>

  </div>

  <div class="description-section">

    <h2>Description</h2>

    <div class="description-line"></div>

    <p class="description-text">
      {{ book.description }}
    </p>

  </div>

</section>
